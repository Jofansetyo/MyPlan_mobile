name: my_plan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Media & File
  image_picker: ^1.1.2
  video_player: ^2.9.1
  path_provider: ^2.1.4
  
  # UI & State Management
  provider: ^6.1.2
  
  # Local Storage (Penyimpanan Permanen)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Package untuk generate logo
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # 1. Daftarkan Folder Assets
  assets:
    - assets/
    - assets/fonts/
    - assets/images/

  # 2. Daftarkan Font Lokal
  fonts:
    - family: KodeMono
      fonts:
        - asset: assets/fonts/KodeMono-Bold.ttf
          weight: 700
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500

# ==========================================
# KONFIGURASI LOGO APLIKASI (LAUNCHER ICONS)
# ==========================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  
  # Konfigurasi Adaptive Icon untuk Android 8.0+ (HP modern)
  adaptive_icon_background: "#E4E4E4" 
  adaptive_icon_foreground: "assets/images/app_icon.png"